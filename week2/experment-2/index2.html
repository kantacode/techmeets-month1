<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール</title>
  <style>
    * {
      box-sizing: border-box;
    }

    /* 画面の真ん中にカードを置く */
    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      background: #f0f0f0;
      color: #333;
    }

    .card {
      width: 400px;
      max-width: 100%; /* 画面が狭いときははみ出さない */
      padding: 32px 24px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .icon {
      display: block;
      width: 100px;
      height: 100px;
      margin: 0 auto;
      border-radius: 50%;
      object-fit: cover;
    }

    .name {
      margin: 16px 0 0;
      font-size: 22px;
    }

    .comment {
      margin: 8px 0 0;
      font-size: 14px;
      color: #666;
    }

    /* スキルバッジを横並びにする */
    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }

    .badge {
      padding: 4px 12px;
      font-size: 13px;
      color: #fff;
      background: #4a90e2;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="https://placehold.jp/100x100.png" alt="アイコン画像">
    <h1 class="name">山田 太郎</h1>
    <p class="comment">Webエンジニアを目指して勉強中です！</p>
    <ul class="skills" id="skills"></ul>
  </div>

  <script>
    // スキルの一覧（ここを書き換えるとバッジが変わる）
    const skills = ["HTML", "CSS", "JavaScript", "Git"];

    const skillsList = document.getElementById("skills");

    // スキルの数だけバッジを作って並べる
    skills.forEach((skill) => {
      const badge = document.createElement("li");
      badge.className = "badge";
      badge.textContent = skill;
      skillsList.appendChild(badge);
    });
  </script>
</body>
</html>
