<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      background: #f2f4f7;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
      text-align: center;
    }

    .form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .form input:focus {
      border-color: #4a90e2;
    }

    .form button {
      padding: 10px 16px;
      font-size: 16px;
      color: #fff;
      background: #4a90e2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .form button:hover {
      background: #357abd;
    }

    /* 空欄のときは押せないことが分かるようにグレーにする */
    .form button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      margin-bottom: 8px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .item-text {
      flex: 1;
      cursor: pointer;
      word-break: break-all;
    }

    .item.done .item-text {
      color: #aaa;
      text-decoration: line-through;
    }

    .delete-btn {
      padding: 6px 10px;
      font-size: 14px;
      color: #fff;
      background: #e25c5c;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #c94444;
    }

    .empty {
      color: #999;
      text-align: center;
    }

    .count {
      margin: 0 0 12px;
      font-size: 14px;
      color: #666;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ToDoリスト</h1>

    <form class="form" id="todo-form">
      <input type="text" id="todo-input" placeholder="タスクを入力" autocomplete="off">
      <button type="submit" id="add-btn" disabled>追加</button>
    </form>

    <p class="count" id="todo-count"></p>

    <ul class="list" id="todo-list"></ul>
  </div>

  <script>
    // タスクを管理する配列
    const todos = [];

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const addBtn = document.getElementById("add-btn");
    const list = document.getElementById("todo-list");
    const count = document.getElementById("todo-count");

    // 配列の内容をもとにリストを描画する
    function render() {
      list.innerHTML = "";

      // 完了件数 / 総件数
      const doneCount = todos.filter((todo) => todo.done).length;
      count.textContent = `完了 ${doneCount} / ${todos.length} 件`;

      if (todos.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "タスクはありません";
        list.appendChild(empty);
        return;
      }

      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        li.className = "item" + (todo.done ? " done" : "");

        const text = document.createElement("span");
        text.className = "item-text";
        text.textContent = todo.text;
        text.addEventListener("click", () => {
          todos[index].done = !todos[index].done;
          render();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "削除";
        deleteBtn.addEventListener("click", () => {
          todos.splice(index, 1);
          render();
        });

        li.appendChild(text);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    // タスクを追加する
    // <form> の submit イベントなので、追加ボタンでもEnterキーでも呼ばれる
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      // 空欄やスペースだけの入力は追加しない
      if (text === "") return;

      todos.push({ text: text, done: false });
      input.value = "";
      updateAddButton();
      render();
    });

    // 入力欄が空（スペースだけも含む）のときは追加ボタンを押せなくする
    function updateAddButton() {
      addBtn.disabled = input.value.trim() === "";
    }
    input.addEventListener("input", updateAddButton);

    render();
  </script>
</body>
</html>
